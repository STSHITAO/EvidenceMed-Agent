### model
model_name_or_path: /root/autodl-tmp/Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset: medvqa_data,medical_llama3_short
dataset_dir: ../../datasets/processed/llamafactory
template: qwen3_vl_nothink
cutoff_len: 2048
max_samples: 100000
overwrite_cache: false
preprocessing_num_workers: 16
image_min_pixels: 1024
image_max_pixels: 589824

### output
output_dir: ../../models/adapters/qwen3-vl-8b-medical-lora-next
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.00005
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_steps: 0
bf16: true
ddp_timeout: 180000000
report_to: none
